name: "[K8S] Build and push staking-vault-widget to dev"

run-name: "[K8S] Build and push staking-vault-widget:dev to dev"

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/**'
      - 'tests/**'
      - '**.md'

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@main
    with:
      target: dev
      harbor_project: team-si
      image: staking-vault-widget
      # dockerfile: path/to/Dockerfile
    secrets: inherit
